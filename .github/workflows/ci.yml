name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Use bash on every runner (including Windows) so command-line quoting — e.g.
# `-coverprofile=coverage.out ./...` — parses identically across the matrix.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo 'run gofmt -w .'; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go mod verify

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Evaluate against the latest patched toolchain so govulncheck sees a
          # fixed standard library rather than go.mod's declared minimum.
          go-version: stable
      # Intentionally @latest: for a security scanner, an up-to-date analyzer and
      # vulnerability database matter more than build reproducibility of the tool
      # itself. Dependabot keeps the pinned actions current.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
